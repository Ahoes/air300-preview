    <linearGradient id="casco" x1="0" x2="1"><stop offset="0" stop-color="#C9C04A"/><stop offset="0.4" stop-color="#EDE58A"/><stop offset="1" stop-color="#B8AE3A"/></linearGradient>
    <g id="bombero">
