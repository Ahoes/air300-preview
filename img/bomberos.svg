  <!-- Parque de bomberos -->
  <rect width="800" height="260" fill="#D3D9DE"/>
  <path d="M0 40 H800" stroke="#C3CAD0" stroke-width="2"/>
  <rect x="0" y="0" width="140" height="230" fill="#B4441C"/>
  <rect x="18" y="26" width="104" height="70" rx="4" fill="#2A4256"/>
  <rect x="0" y="140" width="140" height="6" fill="#D9E24F"/>
  <rect x="640" y="20" width="180" height="210" fill="#C3CAD0"/>
  <path d="M640 56 H820 M640 92 H820 M640 128 H820 M640 164 H820 M640 200 H820" stroke="#AEB7BF" stroke-width="3"/>
  <rect y="230" width="800" height="30" fill="#9AA5AF"/>

  <!-- Bomberos -->
  <use href="#bombero" transform="translate(540 92) scale(0.86)" opacity="0.92"/>
  <use href="#bombero" transform="translate(360 70)"/>
