      <rect x="-99" y="150" width="30" height="9" fill="#D9E24F" transform="rotate(-2 -84 154)"/>
      <rect x="-99" y="159" width="30" height="6" fill="#C9D1D8" transform="rotate(-2 -84 162)"/>
      <rect x="69" y="150" width="30" height="9" fill="#D9E24F" transform="rotate(2 84 154)"/>
      <rect x="69" y="159" width="30" height="6" fill="#C9D1D8" transform="rotate(2 84 162)"/>
      <!-- Chaquetón -->
      <path d="M-80 36 Q0 14 80 36 L72 230 L-72 230 Z" fill="#22414C"/>
      <rect x="-76" y="168" width="152" height="12" fill="#D9E24F"/>
      <rect x="-76" y="180" width="152" height="7" fill="#C9D1D8"/>
      <rect x="-76" y="187" width="152" height="5" fill="#D9E24F"/>
