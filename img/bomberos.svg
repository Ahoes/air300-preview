<?xml version="1.0" encoding="UTF-8"?>
<!-- Imagen provisional: bomberos de espaldas con equipo de respiración autónoma -->
<svg viewBox="0 0 800 260" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
