      <path d="M-40 -6 C-40 -56 40 -56 40 -6 Z" fill="url(#casco)"/>
      <path d="M-46 -8 Q0 4 46 -8 L46 -2 Q0 12 -46 -2 Z" fill="#A99F32"/>
      <rect x="-6" y="-46" width="12" height="40" rx="5" fill="#B8AE3A"/>
