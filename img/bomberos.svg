      <path d="M-46 30 C-40 70 -36 110 -30 160" fill="none" stroke="#111A1F" stroke-width="12"/>
      <path d="M46 30 C40 70 36 110 30 160" fill="none" stroke="#111A1F" stroke-width="12"/>
      <rect x="-34" y="40" width="68" height="168" rx="10" fill="#14202A"/>
      <!-- Botella -->
      <rect x="-26" y="34" width="52" height="170" rx="26" fill="url(#botella)"/>
      <rect x="-26" y="182" width="52" height="16" fill="#C9D1D8" opacity="0.9"/>
      <rect x="-9" y="200" width="18" height="16" fill="#A9B6C0"/>
      <rect x="-15" y="214" width="30" height="7" rx="3" fill="#7E8C98"/>
      <rect x="-40" y="78" width="80" height="12" rx="4" fill="#111A1F"/>
      <rect x="-40" y="138" width="80" height="12" rx="4" fill="#111A1F"/>
