<?xml version="1.0" encoding="UTF-8"?>
<!-- Imagen provisional: sustituir por una foto del panel de carga con botellas de buceo (aire y Nitrox) -->
<svg viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyl" x1="0" x2="1"><stop offset="0" stop-color="#3A5469"/><stop offset="0.35" stop-color="#8FA2B2"/><stop offset="0.6" stop-color="#5F7487"/><stop offset="1" stop-color="#2A4256"/></linearGradient>
    <g id="botella">
      <rect x="0" y="0" width="64" height="210" rx="32" fill="url(#cyl)"/>
      <rect x="22" y="-24" width="20" height="28" fill="#A9B6C0"/>
      <rect x="14" y="-30" width="36" height="8" rx="4" fill="#C9D1D8"/>
    </g>
    <g id="banda-nitrox">
      <rect x="0" y="0" width="64" height="26" fill="#FFD100"/>
      <rect x="0" y="4" width="64" height="18" fill="#1E7A3C"/>
    </g>
    <g id="manometro">
      <circle r="26" fill="#E9EDF0" stroke="#5F7487" stroke-width="4"/>
      <line x1="0" y1="0" x2="14" y2="-12" stroke="#B4441C" stroke-width="3" stroke-linecap="round"/>
      <circle r="3" fill="#1A3044"/>
    </g>
  </defs>
  <rect width="1200" height="420" fill="#E4E7EA"/>
  <path d="M0 60 H1200" stroke="#D6DADE" stroke-width="2"/>
  <rect y="360" width="1200" height="60" fill="#C9CDD1"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#B7BFC6" stroke-width="3"/>

  <!-- Panel de carga -->
  <rect x="70" y="80" width="270" height="210" rx="4" fill="#1A3044"/>
  <use href="#manometro" x="125" y="132"/>
  <use href="#manometro" x="205" y="132"/>
  <use href="#manometro" x="285" y="132"/>
  <rect x="113" y="196" width="24" height="12" fill="#B4441C"/>
  <rect x="193" y="196" width="24" height="12" fill="#B4441C"/>
  <rect x="273" y="196" width="24" height="12" fill="#B4441C"/>
  <rect x="94" y="236" width="222" height="26" fill="#2A4256"/>
  <rect x="104" y="244" width="70" height="10" fill="#3E8E5A"/>

  <!-- Látigos de carga -->
  <path d="M125 290 C125 340 300 60 452 112" fill="none" stroke="#5F7487" stroke-width="5"/>
  <path d="M205 290 C205 350 420 70 552 112" fill="none" stroke="#5F7487" stroke-width="5"/>
  <path d="M285 290 C285 360 540 80 652 112" fill="none" stroke="#5F7487" stroke-width="5"/>

  <!-- Botellas en el soporte -->
  <use href="#botella" x="420" y="140"/>
  <use href="#botella" x="520" y="140"/>
  <use href="#banda-nitrox" x="520" y="166"/>
  <use href="#botella" x="620" y="140"/>
  <use href="#botella" x="720" y="140"/>
  <use href="#banda-nitrox" x="720" y="166"/>
  <use href="#botella" x="820" y="140"/>
  <use href="#botella" x="920" y="140"/>
  <use href="#banda-nitrox" x="920" y="166"/>
  <use href="#botella" x="1020" y="140"/>
  <rect x="400" y="300" width="720" height="12" fill="#2A4256"/>
  <rect x="400" y="312" width="12" height="48" fill="#2A4256"/>
  <rect x="1108" y="312" width="12" height="48" fill="#2A4256"/>
</svg>
